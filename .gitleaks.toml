title = "FlowMind repository secret scanning"

[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase backend secret"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
keywords = ["gsk_"]

[[rules]]
id = "legacy-supabase-service-role-jwt"
description = "Legacy Supabase service-role JWT"
regex = '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'''
keywords = ["service_role"]

[[rules]]
id = "flowmind-master-key-assignment"
description = "Committed FlowMind credential master key"
regex = '''FLOWMIND_CREDENTIAL_MASTER_KEY\s*=\s*[A-Za-z0-9+/]{40,}={0,2}'''
keywords = ["FLOWMIND_CREDENTIAL_MASTER_KEY"]

[[rules]]
id = "turnstile-secret-assignment"
description = "Committed Turnstile secret"
regex = '''TURNSTILE_SECRET_KEY\s*=\s*0x[A-Za-z0-9_-]{20,}'''
keywords = ["TURNSTILE_SECRET_KEY"]

